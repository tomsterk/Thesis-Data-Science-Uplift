<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CATE Explorer — Winback Experiment Dashboard</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ── Reset & Base ─────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #101318;
  --surface:  #161b27;
  --surface2: #1c2233;
  --surface3: #242b3e;
  --border:   #333b58;
  --grid:     #1e2538;
  --text:     #edf1fa;
  --text2:    #c0c8de;
  --muted:    #7580a0;
  --ctrl:     #8b95a8;
  --trtm:     #34d399;
  --pos:      #3ecf8e;
  --neg:      #e86a6a;
  --accent:   #3ecf8e;
  --accent-dim: #2a9464;
  --font:     'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --serif:    'Instrument Serif', Georgia, serif;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── Grain overlay ────────────────────────────────────────────────────────── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  background-size: 256px;
}

/* ── Layout shell ─────────────────────────────────────────────────────────── */
.dashboard {
  max-width: 1400px;
  margin: 0 auto;
  padding: 28px 32px 48px;
}

/* ── Header ───────────────────────────────────────────────────────────────── */
.header {
  display: flex;
  align-items: baseline;
  gap: 16px;
  margin-bottom: 6px;
}
.header h1 {
  font-family: var(--serif);
  font-size: 32px;
  font-weight: 400;
  color: var(--text);
  letter-spacing: -0.5px;
}
.header .subtitle {
  font-size: 13px;
  color: var(--text);
  font-weight: 700;
}

/* ── Pill selectors ───────────────────────────────────────────────────────── */
.pill-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.pill-row .label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text);
  margin-right: 4px;
  white-space: nowrap;
}
.pill {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12.5px;
  font-weight: 500;
  font-family: var(--font);
  color: var(--text2);
  background: transparent;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
  user-select: none;
}
.pill:hover {
  background: var(--surface3);
  border-color: var(--muted);
  color: var(--text);
}
.pill.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--bg);
  font-weight: 600;
  box-shadow: 0 0 16px rgba(62, 207, 142, 0.2);
}

/* ── Segment dropdown ─────────────────────────────────────────────────────── */
.seg-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
}
.seg-btn {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  font-family: var(--font);
  color: var(--muted);
  background: transparent;
  border: 1px dashed var(--border);
  cursor: pointer;
  transition: all 0.2s ease;
}
.seg-btn:hover { border-color: var(--muted); color: var(--text2); }
.seg-btn.active-seg {
  border-style: solid;
  border-color: var(--accent-dim);
  color: var(--accent);
}
.seg-dropdown {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  z-index: 100;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  min-width: 240px;
  max-height: 360px;
  overflow-y: auto;
  box-shadow: 0 12px 48px rgba(0,0,0,0.5);
  padding: 6px;
}
.seg-dropdown.open { display: block; }
.seg-item {
  padding: 8px 14px;
  font-size: 13px;
  cursor: pointer;
  border-radius: 8px;
  transition: background 0.15s;
  color: var(--text2);
}
.seg-item:hover { background: var(--surface3); }
.seg-item.active { background: var(--border); color: var(--accent); font-weight: 600; }
.seg-divider { height: 1px; background: var(--border); margin: 4px 8px; }

/* ── KPI strip ────────────────────────────────────────────────────────────── */
.kpi-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin: 16px 0;
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 20px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s;
}
.kpi-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(62,207,142,0.03) 0%, transparent 60%);
  pointer-events: none;
}
.kpi-card .kpi-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--text);
  margin-bottom: 6px;
}
.kpi-card .kpi-value {
  font-family: var(--font);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.5px;
}
.kpi-card .kpi-sub {
  font-size: 12px;
  color: var(--text2);
  margin-top: 4px;
}
.kpi-pos { color: var(--pos); }
.kpi-neg { color: var(--neg); }
.kpi-neutral { color: var(--text); }

/* ── Insight sentence ─────────────────────────────────────────────────────── */
.insight-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 16px;
  min-height: 48px;
}
.insight-bar .bulb {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-dim), var(--accent));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}
.insight-bar .insight-text {
  font-size: 13.5px;
  color: var(--text2);
  line-height: 1.5;
  flex: 1;
}
.insight-bar .insight-text strong {
  color: var(--text);
  font-weight: 600;
}
.insight-bar .insight-text .up-val {
  color: var(--pos);
  font-weight: 700;
}
.insight-bar .insight-text .down-val {
  color: var(--neg);
  font-weight: 700;
}
.copy-btn {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: var(--surface3);
  border: 1px solid var(--border);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font);
}
.copy-btn:hover { background: var(--border); color: var(--text); }
.copy-btn.copied { background: var(--accent-dim); color: var(--bg); border-color: var(--accent-dim); }

/* ── Chart container ──────────────────────────────────────────────────────── */
.chart-section {
  position: relative;
}
.chart-title {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 400;
  color: var(--text);
  margin-bottom: 4px;
  font-style: italic;
}
.chart-title .exp-tag {
  font-family: var(--font);
  font-style: normal;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  background: rgba(62,207,142,0.1);
  padding: 3px 10px;
  border-radius: 12px;
  margin-left: 12px;
  vertical-align: middle;
  letter-spacing: 0.3px;
}
/* ── Best bin annotation pulse ────────────────────────────────────────────── */
@keyframes pulse-glow {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

/* ── Responsive ───────────────────────────────────────────────────────────── */
@media (max-width: 900px) {
  .kpi-strip { grid-template-columns: repeat(2, 1fr); }
  .dashboard { padding: 16px; }
}

/* ── Plotly overrides ─────────────────────────────────────────────────────── */
.plotly .modebar { opacity: 0 !important; transition: opacity 0.3s !important; }
.plotly:hover .modebar { opacity: 0.5 !important; }


</style>
</head>

</div>

  // ── Main apply function ────────────────────────────────────────────────────
  function apply() {
    let ti = D.comboMatrix[aS]?.[aE]?.[aC];
    if (ti == null) {
      ti = D.comboMatrix[0]?.[aE]?.[aC];
      if (ti == null) return;
      aS = 0;
    }

    updatePills();
    updateKPIs();
    renderChart(ti);
    updateInsight(ti);
    updateChartTitle();
  }

  function updatePills() {
    document.querySelectorAll("#exp-pills .pill").forEach((el, i) => {
      el.classList.toggle("active", i === aE);
    });
    document.querySelectorAll("#cov-pills .pill").forEach((el, i) => {
      el.classList.toggle("active", i === aC);
    });
    const segBtn = document.getElementById("seg-btn");
    if (segBtn) {
      segBtn.textContent = D.segLabels[aS] + " ▾";
      segBtn.classList.toggle("active-seg", aS > 0);
    }
    document.querySelectorAll(".seg-item").forEach((el, i) => {
      el.classList.toggle("active", i === aS);
    });
  }

  function updateKPIs() {
    const key = aS + "," + D.expKeys[aE];
    const kpi = D.expKpis[key] || {};
    const strip = document.getElementById("kpi-strip");

    const uplift = kpi.uplift || 0;
    const upliftClass = uplift >= 0 ? "kpi-pos" : "kpi-neg";

    strip.innerHTML = `
      <div class="kpi-card">
        <div class="kpi-label">Overall Uplift</div>
        <div class="kpi-value ${upliftClass}">${spct(uplift)}</div>

    const bins = t.bins;

    const CTRL_LINE  = "rgba(139,149,168,0.75)";

    const TRT_LINE   = "rgba(52,211,153,0.90)";

    // Uplift bar colors — green for positive, red for negative
    const upliftColors = t.uplift.map(v =>
      v == null ? "rgba(90,100,136,0.3)" : v >= 0
        ? `rgba(52,211,153,${0.45 + Math.min(Math.abs(v) * 18, 0.45)})`
        : `rgba(232,106,106,${0.45 + Math.min(Math.abs(v) * 18, 0.45)})`
    );
    const upliftBorders = t.uplift.map(v =>
      v == null ? "rgba(90,100,136,0.15)" : v >= 0
        ? "rgba(52,211,153,0.85)"
        : "rgba(232,106,106,0.85)"
    );

    // Best bin annotation
    const bestIdx = t.best_idx;
    const annotationsUp = [];
    if (bestIdx != null && t.uplift[bestIdx] != null) {
      annotationsUp.push({
        x: bins[bestIdx],
        y: t.uplift[bestIdx],
        xref: "x", yref: "y",
        text: `<b>${spct(t.uplift[bestIdx])}</b>`,
        showarrow: true, arrowhead: 0, arrowwidth: 1.5,
        arrowcolor: "#3ecf8e", ax: 0, ay: -32,

      font: { size: 12, color: "#edf1fa", family: "DM Sans, sans-serif" },

    copyBtn.textContent = "Copy";
    copyBtn.classList.remove("copied");
  }

  // ── Copy insight ───────────────────────────────────────────────────────────
  window.copyInsight = function() {
    navigator.clipboard.writeText(currentInsightText).then(() => {
      const btn = document.getElementById("copy-btn");
      btn.textContent = "Copied ✓";
      btn.classList.add("copied");
      setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("copied"); }, 2000);
    });
  };

  // ── Initial render ─────────────────────────────────────────────────────────
  apply();

})();
</script>
</body>
</html>
